[package]
name = "sparky"
version = "0.1.6"
edition = "2024"

[dependencies]
image = "0.25.1"
gl = "0.14.0"
glfw = "0.59.0"
rand = "0.9.2"
tray-icon = "0.21.1"
log = "0.4.27"
simplelog = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"
ureq = { version = "2.12", features = ["json", "tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", default-features = false, features = ["tokio"] }
slint = "1.18.1"

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18.2"
