name: Release AppImage

"on":
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libglfw3-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            ffmpeg \
            file
          # Ensure FUSE compatibility across Ubuntu versions
          sudo apt-get install -y libfuse2t64 2>/dev/null || sudo apt-get install -y libfuse2 2>/dev/null || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Transcode animations to WebP
        run: |
          chmod +x ./scripts/transcode_assets.sh
          ./scripts/transcode_assets.sh

      - name: Build and package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x ./scripts/package_appimage.sh
          ./scripts/package_appimage.sh --test

      - name: Generate SHA256 checksum
        run: |
          sha256sum Sparky-x86_64.AppImage > Sparky-x86_64.AppImage.sha256

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparky-appimage
          path: |
            Sparky-x86_64.AppImage
            Sparky-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Attach AppImage to Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            Sparky-x86_64.AppImage \
            Sparky-x86_64.AppImage.sha256 \
            --clobber
