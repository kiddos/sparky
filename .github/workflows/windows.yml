name: Windows Build & Single Executable

"on":
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Transcode animations to WebP
        shell: bash
        run: |
          chmod +x ./scripts/transcode_assets.sh
          ./scripts/transcode_assets.sh

      - name: Run unit and integration tests
        run: cargo test --release

      - name: Build standalone single executable
        run: cargo build --release

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd target/release
          sha256sum sparky.exe > sparky.exe.sha256
          cp sparky.exe.sha256 ../../

      - name: Upload Windows Executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparky-windows-x86_64
          path: |
            target/release/sparky.exe
            sparky.exe.sha256
          if-no-files-found: error

      - name: Attach Windows Executable to Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            target/release/sparky.exe \
            sparky.exe.sha256 \
            --clobber
